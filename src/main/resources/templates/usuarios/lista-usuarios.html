<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <h1>Cadastro de Usuários</h1>
</header>

<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>

<main>
    <h2>Novo usuário</h2>

    <form th:action="@{/usuarios}" method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required>

        <button type="submit">Cadastrar usuário</button>
    </form>

    <h2>Usuários cadastrados</h2>

    <ul>
        <li th:each="u, iterStat : ${usuarios}">
            <span th:text="|${u.nome} — ${u.email} — ${u.cpf}|"></span>

            <form th:action="@{/usuarios/remover/{indice}(indice=${iterStat.index})}"
                  method="post">
                <button type="submit">Excluir</button>
            </form>
        </li>
    </ul>
</main>

</body>
</html>
